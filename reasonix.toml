[permissions]
allow = ["Edit", "Bash=Select-String -Path 技术方案.md -Pattern \"chapter|Chapter\" | ForEach-Object { \"$($_.LineNumber): $($_.Line)\" }", "Bash=Select-String -Path 技术方案.md -Pattern \"chapter_no|ref_chapter_no|first_appear_chapter|firstAppearChapter|firstAppear|last_active_chapter|start_chapter|end_chapter|join_chapter|leave_chapter|startChapter|endChapter|currentChapter|firstSort|lastActiveSort|lastActive\" | ForEach-Object { \"$($_.LineNumber): $($_.Line)\" }", "Bash=Select-String -Path 技术方案.md -Pattern \"PostgreSQL|通义|SQLite|DeepSeek|GLM|3D 关系图是|可选\" | ForEach-Object { \"$($_.LineNumber): $($_.Line)\" }", "Bash=Select-String -Path 技术方案.md -Pattern \"bigserial|jsonb\" | ForEach-Object { \"$($_.LineNumber): $($_.Line)\" }", "Bash=cd /d E:\\写作星河; if ($?) { New-Item -ItemType Directory -Force -Path ui\\prototype | Out-Null; dir ui }", "Bash=Set-Location 'E:\\写作星河'; if ($?) { New-Item -ItemType Directory -Force -Path ui\\prototype | Out-Null; dir ui }", "Bash=Set-Location 'E:\\写作星河\\ui\\prototype'; $html = Get-Content -Raw index.html; $m = [regex]::Match($html, '(?s)<script>(.*?)</script>'); $js = $m.Groups[1].Value; $tmp = Join-Path $env:TEMP 'wx_proto_check.js'; Set-Content -Path $tmp -Value $js -Encoding UTF8; node --check $tmp; if ($?) { \"JS syntax OK\" }", "Bash=Set-Location 'E:\\写作星河\\ui\\prototype'; node -e \"const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);fs.writeFileSync(process.env.TEMP+'/wx_check.js',m[1].replace(/\\uFEFF/g,''));\" ; node --check $env:TEMP\\wx_check.js; if ($?) { \"JS syntax OK\" }"]
