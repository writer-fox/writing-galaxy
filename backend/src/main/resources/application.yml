server:
  port: 8080

spring:
  datasource:
    url: "jdbc:sqlite:data/writer.db?foreign_keys=on&journal_mode=WAL"
    driver-class-name: org.sqlite.JDBC
    # SQLite 不需要用户名/密码
  sql:
    init:
      # 启动时执行 schema.sql（幂等）
      mode: always

logging:
  level:
    com.writer: info

# LLM（可选）：配置 api-key 后 AI 接口才可用
# provider: glm | deepseek | （留空则默认 Chat Completions 通用端点）
# api-key:  请在环境变量 LLM_API_KEY 或此处填入
# base-url:  默认按 provider 选择（GLM→open.bigmodel.cn/v4，DeepSeek→api.deepseek.com/v1）
# model:     默认 glm-4 / deepseek-chat
llm:
  provider: ${LLM_PROVIDER:}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}
